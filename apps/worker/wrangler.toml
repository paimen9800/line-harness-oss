name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# Default env uses both flags for stricter fetch behavior in dev/test.
# Production uses only "nodejs_compat" (live API confirmed 2026-11-24).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# keep_vars = true: wrangler deploy will NOT delete existing plain_text vars.
# This is a safety measure so that a normal `wrangler deploy --env production`
# (without remembering --keep-vars flag) cannot wipe live environment variables.
# The --keep-vars CLI flag is now redundant but harmless.
# Note: Secrets are never deleted by deploy regardless of this setting.
keep_vars = true

# ═══════════════════════════════════════════════════════════════
# デフォルト環境 = 開発・テスト用
# 使い方: npx wrangler deploy
#
# WARNING: This is NOT production. The name is "line-harness" (not
# "line-harness-seikatsu"), so deploying this env cannot overwrite production.
# To deploy to production, use: npx wrangler deploy --env production
# ═══════════════════════════════════════════════════════════════
account_id = "YOUR_DEV_ACCOUNT_ID"

# Workers Cache pilot. Enabled only for the private test Worker; production is
# explicitly disabled below until cache hit rate and auth isolation are proven.
# Only routes with an explicit public Cache-Control header are eligible because
# src/middleware/cache-policy.ts marks every other response no-store.
[cache]
enabled = true

[assets]
directory = "dist/client"
binding = "ASSETS"
# Worker を先に走らせて bot UA → OGP HTML 差し込みを可能にする。
# 通常 UA のときは Worker の notFound 内で c.env.ASSETS.fetch(req) を呼んで
# SPA を返す。これが無いと static asset path が Worker をバイパスして
# 直接配信され、bot 判定が効かない。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "YOUR_DEV_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

# ═══════════════════════════════════════════════════════════════
# TenantScheduler DO — コードはあるが、本番には一度もバインドされていない。
# 2026-11-19 時点の line-harness-seikatsu は DO バインディングなしで稼働中。
# この wrangler.toml からバインディングを外すことで、wrangler deploy が
# 誤って DO を追加することを防ぐ。将来 DO を有効にする場合は、
# durable_objects.bindings と migrations を復活させる必要がある。
# 参照: apps/worker/src/durable-objects/tenant-scheduler.ts (コードは残す)
# ═══════════════════════════════════════════════════════════════
# [[durable_objects.bindings]]
# name = "TENANT_SCHEDULER"
# class_name = "TenantScheduler"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["TenantScheduler"]

# Cron Trigger — 本番の line-harness-seikatsu は */5 と 0 */6 で稼働中。
# 毎分 cron (* * * * *) に戻すと D1 rows read が増加するため、5分粒度を維持。
[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Phase 5 self-update vars — consumed by /admin/update/*. Secrets
# (CF_API_TOKEN) must be set via `wrangler secret put`
# and are intentionally absent from this file.
# 注: [env.production] には意図的に置かない。本番は GitHub Actions デプロイ
# 運用のため self-update は使わず、vars/secrets 不在で route は実行時ガードで
# 不活性になる (本番挙動を変えないための判断, 2026-07-07)。
# ═══════════════════════════════════════════════════════════════
# LOG_RETENTION_DAYS: days to keep messages_log rows (archived to R2 first).
# Unset = keep forever (default). Set per-deployment, not here.
# Instagram spec 08 (optional): IG_LINK_TOKEN_POLICY selects off / prefer / require.
# Store IG_LINK_TOKEN_SECRET and IG_HARNESS_LINK_SECRET as secrets, not vars.
# IG_LINK_TOKEN_SECRET overrides the HKDF fallback from IG_HARNESS_LINK_SECRET.
# See docs/IG_LINK_TOKEN.md for migration 075 and coordinated rollout.
[vars]
WORKER_NAME = "line-harness"
ADMIN_PAGES_PROJECT = "line-harness-admin"
LIFF_PAGES_PROJECT = "line-harness-liff"
D1_DATABASE_ID = "YOUR_DEV_D1_DATABASE_ID"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://line-harness.workers.dev"
ADMIN_PUBLIC_URL = "https://line-harness-admin.pages.dev"
LIFF_PUBLIC_URL = "https://line-harness-liff.pages.dev"
CF_ACCOUNT_ID = "YOUR_DEV_ACCOUNT_ID"

# ═══════════════════════════════════════════════════════════════
# 本番環境 — line-harness-seikatsu
#
# DEPLOY COMMAND:
#   npx wrangler deploy --env production
#
# The top-level keep_vars = true ensures existing vars are preserved.
# The --keep-vars CLI flag is redundant but harmless if added.
#
# D1 migrations:
#   npx wrangler d1 execute line-crm --env production --remote --file ...
#
# IMPORTANT:
# - Do NOT add placeholder [env.production.vars] — that would overwrite live values.
# - Secrets are never deleted by deploy regardless of keep_vars.
# ═══════════════════════════════════════════════════════════════
[env.production]
name = "line-harness-seikatsu"
# Production uses only "nodejs_compat" (confirmed from live API 2026-11-24).
# "global_fetch_strictly_public" is NOT in production; adding it could change behavior.
compatibility_flags = ["nodejs_compat"]

# [cache] status in production is UNCONFIRMED (not visible in settings API).
# The 2026-09-13 build predates the [cache] addition (commit 3ae1c2b), so it
# likely had no cache config. Omitting [env.production.cache] entirely to avoid
# changing unknown live behavior. If cache was enabled, this preserves it;
# if disabled or absent, this also preserves that state.
# UNCONFIRMED: Verify via Cloudflare dashboard or test request if cache behavior matters.

# UNCONFIRMED: Whether run_worker_first matches live production cannot be verified
# from the settings API. It was added in commit 8dd667d (2026-05-19), before the
# 9/13 build, so it's likely present. If routing differs after deploy, this may
# be the cause — verify via test request to static asset paths.
[env.production.assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
# Live production database_id (confirmed from live API 2026-11-24)
database_id = "965e8ffb-6221-4087-85b8-4109cd22c75f"

[[env.production.r2_buckets]]
binding = "IMAGES"
# Live production bucket name (confirmed from live API 2026-11-24)
bucket_name = "line-harness-seikatsu-images"

# production 環境も DO バインディングなし (本番の line-harness-seikatsu に合わせる)。
# [[env.production.durable_objects.bindings]]
# name = "TENANT_SCHEDULER"
# class_name = "TenantScheduler"

[env.production.triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]
